  "nodes": [
    {"id": "def_isometry", "kind": "definition", "stage": 0, "title": "Isometry", "detail": "XX^T = I_D", "source": "archival/background.tex:13", "label": "def:isometry"},
    {"id": "prop_orthonormal_spectrum", "kind": "proposition", "stage": 0, "title": "Spectrum characterizes isometry", "detail": "sigma_1 = ... = sigma_D = 1 iff X is an isometry", "source": "archival/background.tex:20", "label": "prop:orthonormal_spectrum"},
    {"id": "prop_orthonormal_basis", "kind": "proposition", "stage": 0, "title": "Columns characterize isometry", "detail": "Square X is isometric iff its columns are orthonormal", "source": "archival/background.tex:24", "label": "prop:orthonormal_basis"},
    {"id": "def_differential", "kind": "definition", "stage": 0, "title": "Differential Dphi(xi)", "detail": "Matrix of derivatives in tangent bases", "source": "archival/background.tex:32", "status": "unlabeled"},
    {"id": "def_point_isometry", "kind": "definition", "stage": 0, "title": "Isometry at a point", "detail": "Dphi(xi) is an isometry", "source": "archival/background.tex:40", "label": "def:isometric_at_a_point"},
    {"id": "def_point_conformal", "kind": "definition", "stage": 0, "title": "Conformal at a point", "detail": "Dphi(xi)^T Dphi(xi) = lambda(xi) I_D", "source": "archival/background.tex:45", "label": "def:conformal_at_a_point"},
    {"id": "prop_distance_isometry", "kind": "proposition", "stage": 0, "title": "Distance preservation iff pointwise isometry", "detail": "Global distance preservation iff smooth and isometric at every point", "source": "archival/background.tex:51", "label": "prop:distance_differential_isometry"},
    {"id": "prop_distortion_condition", "kind": "proposition", "stage": 0, "title": "Local distortion is condition number", "detail": "Distortion tends to sigma_1(Df_S)/sigma_D(Df_S)", "source": "archival/background.tex:132", "label": "prop:distortion_is_condition_number"},
    {"id": "prop_distortion_conformal", "kind": "proposition", "stage": 0, "title": "Distortion is minimized by conformal maps", "detail": "Condition number is minimized when singular values agree", "source": "archival/background.tex:145", "status": "unlabeled"},
    {"id": "property_rotation", "kind": "property", "stage": 1, "title": "Rotation invariance", "detail": "ell(UX) = ell(X)", "source": "archival/background.tex:177", "label": "property:rotation_invariance"},
    {"id": "property_unique_isometry", "kind": "property", "stage": 1, "title": "Unique isometry minimum", "detail": "arg min ell = {X : XX^T = I_D}", "source": "archival/background.tex:185", "label": "property:unique_isometry_minimum"},
    {"id": "def_sdiv", "kind": "definition", "stage": 1, "title": "S-divergence", "detail": "Log-determinant divergence on positive-definite matrices", "source": "archival/background.tex:193", "status": "unlabeled"},
    {"id": "prop_sdiv_singular", "kind": "proposition", "stage": 1, "title": "S-divergence singular-value form", "detail": "D(X^T X,I)^2 = sum log((sigma + sigma^-1)/2)", "source": "archival/background.tex:199", "label": "prop:sdiv_singular_values", "proof_source": "archival/supplement.tex:104"},
    {"id": "prop_sdiv_min", "kind": "proposition", "stage": 1, "title": "S-divergence is minimized by isometries", "detail": "Unique minimum on full-rank square matrices", "source": "archival/background.tex:207", "label": "prop:sdiv_minimized_by_isometries"},
    {"id": "property_scalar_monotonicity", "kind": "property", "stage": 1, "title": "Monotonicity away from one", "detail": "g decreases below 1 and increases above 1", "source": "archival/method.tex:23", "label": "property:scalar_monotonicity"},
    {"id": "property_log_symmetry", "kind": "property", "stage": 1, "title": "Log-symmetry", "detail": "g(t) = g(1/t)", "source": "archival/method.tex:36", "label": "property:log_symmetry"},
    {"id": "property_pathwise", "kind": "property", "stage": 1, "title": "Column-rescaling monotonicity", "detail": "Each column length is driven toward one with other columns fixed", "source": "archival/method.tex:42", "label": "property:pathwise"},
    {"id": "prop_spectral_impossibility", "kind": "proposition", "stage": 1, "title": "Generic spectral-loss impossibility", "detail": "No sum g(sigma_d(X)) is both log-symmetric and pathwise monotone", "source": "archival/method.tex:57", "label": "prop:log_svd_bad"},
    {"id": "def_symmetric_normalization", "kind": "definition", "stage": 2, "title": "Symmetric normalization n_q", "detail": "n_q(v) = q(||v||_2) v / ||v||_2", "source": "archival/method.tex:94", "label": "def:symmetric_normalization"},
    {"id": "def_specific_g", "kind": "definition", "stage": 2, "title": "Chosen radial profile q", "detail": "q(t) = 2e/(e^t + e^(1/t))", "source": "archival/method.tex:90", "label": "eq:normalization"},
    {"id": "prop_g_convex", "kind": "proposition", "stage": 2, "title": "-log q is convex", "detail": "Convexity of the chosen radial penalty", "source": "archival/method.tex:111", "status": "unlabeled"},
    {"id": "prop_g_smooth", "kind": "proposition", "stage": 2, "title": "q is smooth", "detail": "Smoothness on positive reals", "source": "archival/method.tex:115", "status": "unlabeled"},
    {"id": "prop_g_tail", "kind": "proposition", "stage": 2, "title": "log q has linear tails", "detail": "Linear decay in t and 1/t at the two extremes", "source": "archival/method.tex:119", "status": "unlabeled"},
    {"id": "prop_g_logsumexp", "kind": "proposition", "stage": 2, "title": "Inverse normalization is normalized exp-LogSumExp", "detail": "1/q is the normalized exponential of LogSumExp(t,1/t)", "source": "archival/method.tex:103", "label": "prop:normalization_logsumexp", "proof_source": "archival/supplement.tex:558"},
    {"id": "prop_normalized_spectral_losses", "kind": "proposition", "stage": 2, "title": "Normalized spectral losses", "detail": "Decreasing strictly convex h gives a unique isometry minimum and column-rescaling monotonicity", "source": "archival/method.tex:132", "label": "prop:normalized_spectral_losses", "proof_source": "archival/supplement.tex:128"},
    {"id": "prop_det_singular", "kind": "proposition", "stage": 2, "title": "Inverse determinant ordering", "detail": "|det N|^-1 has the same ordering as L_h for h(u) = -log(u)/2", "source": "archival/method.tex:146", "label": "prop:determinant_singular_values", "proof_source": "archival/supplement.tex:180"},
    {"id": "prop_frob_singular", "kind": "proposition", "stage": 2, "title": "Inverse Frobenius ordering", "detail": "||N^-1||_F has the same ordering as L_h for h(u) = u^-1 - 1", "source": "archival/method.tex:150", "label": "prop:frobenius_inverse_singular_values", "proof_source": "archival/supplement.tex:180"},
    {"id": "def_matrix_normalization", "kind": "missing", "stage": 3, "title": "Matrix normalization w(X)", "detail": "Used as the columnwise normalization passed to basis pursuit, but not formally defined", "source": "archival/method.tex:223", "status": "missing-definition"},
    {"id": "def_group_penalty", "kind": "definition", "stage": 3, "title": "Multitask penalty ||beta||_{1,2}", "detail": "Sum of row Euclidean norms", "source": "archival/method.tex:226", "label": "eq:bp"},
    {"id": "def_mbp", "kind": "definition", "stage": 3, "title": "Multitask basis-pursuit solution set", "detail": "arg min ||beta||_{1,2} subject to Y = X beta", "source": "archival/method.tex:232", "label": "prog:multitask_basis_pursuit"},
    {"id": "def_min_norm", "kind": "definition", "stage": 3, "title": "Minimum-Frobenius MBP selector", "detail": "Chooses the minimum-Frobenius element of the MBP solution set", "source": "archival/method.tex:240", "status": "unlabeled; MLP/MBP notation mismatch"},
    {"id": "def_support", "kind": "definition", "stage": 3, "title": "Row-support map S(beta)", "detail": "Indices of nonzero rows; current codomain incorrectly fixes size D", "source": "archival/method.tex:259", "status": "unlabeled; codomain-error"},
    {"id": "def_ip", "kind": "definition", "stage": 3, "title": "Isometry Pursuit", "detail": "Minimum-norm MBP on w(X) with target I_D, followed by row support", "source": "archival/method.tex:254", "label": "prog:isometry_pursuit"},
    {"id": "prop_penalty_invariance", "kind": "proposition", "stage": 3, "title": "Group penalty is right-unitary invariant", "detail": "||beta U||_{1,2} = ||beta||_{1,2}", "source": "archival/supplement.tex:593", "label": "prop:basis_pursuit_loss_equivalence", "status": "duplicate-label"},
    {"id": "prop_solution_equivariance", "kind": "proposition", "stage": 3, "title": "MBP solution is basis-equivariant", "detail": "Current statement omits the apparent transpose; see MANUSCRIPT_ISSUES.md", "source": "archival/supplement.tex:609", "label": "prop:basis_pursuit_loss_equivalence", "status": "duplicate-label; possible-transpose-error"},
    {"id": "prop_ip_basis_invariance", "kind": "proposition", "stage": 4, "title": "IP support is basis-invariant", "detail": "S(beta_hat(UX)) = S(beta_hat(X))", "source": "archival/method.tex:276", "label": "prop:basis_pursuit_selection_invariance", "proof_source": "archival/supplement.tex:588"},
    {"id": "prop_kkt_isometry", "kind": "proposition", "stage": 4, "title": "An isometric subset yields an MBP minimizer", "detail": "KKT certificate for the solution supported on an orthonormal subset", "source": "archival/supplement.tex:630", "label": "prop:kkt", "status": "malformed-statement"},
    {"id": "prop_support_union", "kind": "proposition", "stage": 4, "title": "Minimum-norm support equals union of minimizing supports", "detail": "The selected minimum-Frobenius solution is asserted to have maximal support", "source": "archival/supplement.tex:690", "label": "prop:support_containment", "status": "needs-proof-review: row-norm vectors are asserted to form an affine space", "proof_source": "archival/supplement.tex:695"},
    {"id": "prop_exact_containment", "kind": "proposition", "stage": 4, "title": "Exact-isometry containment", "detail": "If an orthonormal D-column subset exists, IP contains it", "source": "archival/method.tex:285", "label": "prop:unitary_selection", "status": "statement compares set with coefficient matrix", "proof_source": "archival/supplement.tex:625"},
    {"id": "prop_D_min", "kind": "proposition", "stage": 4, "title": "Cardinality-D optimum is an isometry", "detail": "ell(X_S)=D iff X_S X_S^T=I_D for |S|=D", "source": "archival/method.tex:316", "label": "prop:D_min", "proof_source": "archival/supplement.tex:706"},
    {"id": "example_mercedes", "kind": "example", "stage": 4, "title": "Mercedes-Benz minimum-norm frame", "detail": "A non-isometric tight frame attains the IP lower bound", "source": "archival/method.tex:322", "label": "prop:the_benzito", "status": "duplicate-label"},
    {"id": "example_mercedes_supp", "kind": "example", "stage": 4, "title": "Supplementary frame example", "detail": "An unfinished higher-dimensional frame example", "source": "archival/supplement.tex:1034", "label": "prop:the_benzito", "status": "duplicate-label; unfinished"},
    {"id": "algorithm_two_stage", "kind": "algorithm", "stage": 5, "title": "Two-stage Isometry Pursuit", "detail": "IP screening followed by cardinality-D discrete search", "source": "archival/method.tex:304", "status": "unlabeled"},
    {"id": "prop_loss_complexity", "kind": "proposition", "stage": 5, "title": "Spectral-loss evaluation cost", "detail": "C_ell = O(D^2 P)", "source": "archival/method.tex:348", "label": "prop:computational_complexity", "status": "duplicate-label"},
    {"id": "prop_ip_complexity", "kind": "proposition", "stage": 5, "title": "IP per-step complexity", "detail": "Each Isometry Pursuit step is O(D^2 P)", "source": "archival/method.tex:354", "label": "prop:computational_complexity", "status": "duplicate-label; needs-proof-review", "proof_source": "archival/supplement.tex:715"}
